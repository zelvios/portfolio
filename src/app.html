<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<script>
			(() => {
				const stored = localStorage.getItem('theme');
				document.documentElement.dataset.theme =
					stored === 'light' || stored === 'dark'
						? stored
						: matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark';
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link
			rel="preload"
			href="/fonts/JetBrainsMono-Medium.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const d = document.documentElement;

				const sentinel = document.querySelector('[data-sticky-sentinel]');
				if (sentinel && sentinel.nextElementSibling) {
					const target = sentinel.nextElementSibling;
					new IntersectionObserver(
						([entry]) =>
							target.toggleAttribute(
								'data-stuck',
								!entry.isIntersecting && entry.boundingClientRect.top < 0
							),
						{ rootMargin: '-1px 0px 0px 0px' }
					).observe(sentinel);
				}

				// scroll progress
				const update = () => {
					const max = d.scrollHeight - window.innerHeight;
					d.style.setProperty('--scroll', String(max > 0 ? d.scrollTop / max : 0));
				};
				addEventListener('scroll', update, { passive: true });
				addEventListener('resize', update);
				update();

				// close any open popover when a link inside it is clicked
				document.addEventListener('click', (e) => {
					const target = /** @type {Element} */ (e.target);
					const pop = /** @type {HTMLElement | null} */ (
						target.closest('[popover] a') && target.closest('[popover]')
					);
					if (pop) pop.hidePopover();
				});

				// theme toggle
				document.addEventListener('click', (e) => {
					const btn = /** @type {HTMLElement | null} */ (
						/** @type {Element} */ (e.target).closest('[data-theme-toggle]')
					);
					if (!btn) return;

					const next = d.dataset.theme === 'dark' ? 'light' : 'dark';
					const apply = () => {
						d.dataset.theme = next;
						localStorage.setItem('theme', next);
					};

					const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
					if (!document.startViewTransition || reduce) return apply();

					const { left, top, width, height } = btn.getBoundingClientRect();
					const x = left + width / 2;
					const y = top + height / 2;
					const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));

					document.startViewTransition(apply).ready.then(() => {
						d.animate(
							{ clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
							{ duration: 400, easing: 'ease-in-out', pseudoElement: '::view-transition-new(root)' }
						);
					});
				});

				// scroll-stepped highlights
				document.querySelectorAll('[data-reveal]').forEach((track) => {
					const slides = [...track.querySelectorAll('[data-slide]')];
					const figures = [...track.querySelectorAll('[data-figure]')];
					const n = slides.length;
					const update = () => {
						const r = track.getBoundingClientRect();
						const stage = track.firstElementChild.getBoundingClientRect().height;
						const total = Math.max(r.height - stage, 1);
						const p = Math.min(Math.max(-r.top / total, 0), 0.9999);
						const k = Math.floor(p * n);
						track.style.setProperty('--p', String(p * n - k));
						slides.forEach((s, i) => s.toggleAttribute('data-active', i === k));
						figures.forEach((f, i) => f.toggleAttribute('data-active', i === k));
					};
					addEventListener('scroll', update, { passive: true });
					addEventListener('resize', update);
					update();
				});

				// timed image carousel in highlight figures
				document.querySelectorAll('[data-carousel]').forEach((fig) => {
					const shots = [...fig.querySelectorAll('[data-shot]')];
					const n = shots.length;
					const per = 8000;
					const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
					let start = 0;
					let wasActive = false;
					fig.addEventListener('click', (e) => {
						const btn = /** @type {Element} */ (e.target).closest('[data-goto]');
						if (!btn) return;
						const k = Number(/** @type {HTMLElement} */ (btn).dataset.goto);
						start = performance.now() - k * per;
					});
					const tick = (now) => {
						const active = fig.hasAttribute('data-active');
						if (active && !wasActive) start = now;
						if (!active && wasActive) shots.forEach((s) => s.removeAttribute('data-current'));
						wasActive = active;
						if (active) {
							const p = reduce || n === 1 ? 1 : ((now - start) % (n * per)) / (n * per);
							const cur = reduce ? 0 : Math.min(Math.floor(p * n), n - 1);
							fig.style.setProperty('--p', String(p));
							shots.forEach((s, i) => s.toggleAttribute('data-current', i === cur));
						}
						requestAnimationFrame(tick);
					};
					requestAnimationFrame(tick);
				});

				// close an open lightbox when the page scrolls
				addEventListener(
					'scroll',
					() =>
						document
							.querySelectorAll('[data-lightbox]:popover-open')
							.forEach((p) => p.hidePopover()),
					{ passive: true }
				);
			})();
		</script>
	</body>
</html>
